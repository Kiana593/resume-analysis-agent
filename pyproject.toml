[project]
name = "resume-extraction-agent"
version = "0.1.0"
description = "LangGraph-based agent for extracting structured info from resumes"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.5",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-openai>=0.3",
    "markitdown[pdf]>=0.1",
    "docx2txt>=0.8",
    "pdfplumber>=0.11",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

